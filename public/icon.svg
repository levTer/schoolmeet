<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#090D16"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <!-- Silver Top/Bottom Arc Gradient -->
    <linearGradient id="silver-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>

    <!-- Glowing Amber Gold Wave Gradient -->
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="gold-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Subtle Inner Shadow for Squircle -->
    <linearGradient id="border-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <!-- Base Icon Squircle Canvas -->
  <rect x="16" y="16" width="480" height="480" rx="108" ry="108" fill="url(#bg-grad)"/>
  <rect x="16" y="16" width="480" height="480" rx="108" ry="108" fill="none" stroke="url(#border-glow)" stroke-width="3"/>

  <!-- Logo Mark: Stylized 'E' Flow (Option #9 Exact Geometry) -->
  <g transform="translate(16, 10)">
    <!-- Top Silver Arc -->
    <path d="M 140 160 C 140 140, 160 120, 210 120 L 330 120 C 355 120, 370 135, 370 152 C 370 170, 355 184, 330 184 L 220 184 C 185 184, 165 200, 165 230 C 165 235, 166 240, 168 245 C 150 240, 140 220, 140 160 Z" 
          fill="url(#silver-grad)"/>

    <!-- Center Gold/Amber Wave Ribbon -->
    <path d="M 145 250 C 160 215, 200 210, 240 225 L 340 265 C 370 278, 385 300, 365 325 C 350 342, 325 345, 290 330 L 195 290 C 165 278, 145 265, 145 250 Z" 
          fill="url(#gold-grad)" filter="url(#gold-glow)"/>

    <!-- Bottom Silver Arc -->
    <path d="M 140 332 C 140 295, 175 284, 210 284 L 330 284 C 355 284, 370 299, 370 316 C 370 334, 355 348, 330 348 L 210 348 C 175 348, 140 365, 140 332 Z" 
          fill="url(#silver-grad)"/>
  </g>
</svg>
