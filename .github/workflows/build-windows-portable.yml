name: Build Windows portable

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - windows-portable/**
      - scripts/build-windows-portable.ts
      - scripts/lib/ico.ts
      - scripts/lib/pe.ts
      - scripts/lib/zip.ts
      - public/icon.svg
      - public/eduflow-windows.zip
      - .github/workflows/build-windows-portable.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-portable-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install zig (кросс-компилятор для .exe)
        run: python3 -m pip install --user ziglang && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: npm ci

      # Сборка сама проверяет PE-подсистему, ресурсы иконки и содержимое ZIP.
      - name: Build eduflow-portable.exe and public/eduflow-windows.zip
        run: npm run build:windows

      # Те же проверки для закоммиченного архива + вёрстка кнопок установки.
      - name: Verify committed archive and install block
        run: npx tsx --test scripts/ui-patterns.test.ts

      - uses: actions/upload-artifact@v4
        with:
          name: EduFlow-Windows-${{ github.sha }}
          path: public/eduflow-windows.zip
          if-no-files-found: error
