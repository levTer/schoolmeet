# CI веб-приложения: типы, тесты, сборка и аудит зависимостей.
#
# Зачем: до этого в репозитории были только сборки desktop/Android, а 400+
# тестов не запускались ни в одном PR — регресс проходил молча.
#
# Prisma-клиент генерируется до проверки типов: без него `tsc` не видит типы
# моделей и проверка теряет смысл.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Types, tests & build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      # Заглушки: сборка Next.js не должна требовать реальную БД и секреты.
      DATABASE_URL: "postgresql://user:password@localhost:5432/schoolmeet?schema=public"
      NEXTAUTH_SECRET: "ci-only-secret-not-used-in-production"
      NEXTAUTH_URL: "http://localhost:3000"
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Tests
        id: tests
        run: |
          set +e
          npm test > test.log 2>&1
          status=$?
          tail -80 test.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Report test failures
        if: steps.tests.outputs.status != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const lines = fs.readFileSync('test.log', 'utf8').split('\n');
            const notOk = lines.filter((l) => /not ok \d+/.test(l)).slice(0, 15);
            const failing = lines.filter((l) => /^# (tests|pass|fail) /.test(l)).slice(-6);
            const lastScripts = lines.filter((l) => l.includes('> eduflow@')).slice(-3);
            const failIdx = lines.findIndex((l) => /not ok \d+/.test(l));
            const snippet = failIdx >= 0
              ? lines.slice(Math.max(0, failIdx - 10), failIdx + 45).join('\n')
              : lines.slice(-40).join('\n');
            const body = [
              '### test failures',
              '**last npm scripts:**', '```', ...lastScripts, '```',
              '**summary:**', '```', ...failing, '```',
              '**not ok:**', '```', ...notOk, '```',
              '**snippet:**', '```', snippet.slice(0, 40000), '```',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, body: body.slice(0, 60000),
            });

      - name: Fail on test errors
        if: steps.tests.outputs.status != '0'
        run: exit 1

      - name: Build
        run: npm run build

      - name: Audit production dependencies
        # Пока не блокирует: критический advisory Next.js 14 закрывается
        # мажорным обновлением фреймворка (см. docs/security-hardening.md).
        # После обновления шаг станет обязательным (`continue-on-error` убрать).
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

      - name: Secret scan (пароли и invite-токены в исходниках)
        run: |
          if grep -rnE "Admin123!|Fullhouse123!|Anna123!|admin-(sinlycem|fulhouse|annat)-20" \
             --include="*.ts" --include="*.tsx" --include="*.md" --include="*.json" \
             --exclude-dir=node_modules --exclude-dir=.git .; then
            echo "::error::В репозитории найдены секреты администратора"
            exit 1
          fi
          echo "Секретов не найдено"
