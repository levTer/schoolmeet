# CI веб-приложения: типы, тесты, сборка и аудит зависимостей.
#
# Зачем: до этого в репозитории были только сборки desktop/Android, а 400+
# тестов не запускались ни в одном PR — регресс проходил молча.
#
# Prisma-клиент генерируется до проверки типов: без него `tsc` не видит типы
# моделей и проверка теряет смысл.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  # Временно: шаг диагностики typecheck публикует вывод в комментарий PR.
  pull-requests: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Types, tests & build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      # Заглушки: сборка Next.js не должна требовать реальную БД и секреты.
      DATABASE_URL: "postgresql://user:password@localhost:5432/schoolmeet?schema=public"
      NEXTAUTH_SECRET: "ci-only-secret-not-used-in-production"
      NEXTAUTH_URL: "http://localhost:3000"
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Prisma client
        run: npx prisma generate

      - name: Typecheck
        id: typecheck
        run: |
          set +e
          npx tsc --noEmit > tsc.log 2>&1
          status=$?
          cat tsc.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      # ВРЕМЕННЫЙ шаг диагностики: публикует ошибки typecheck в PR.
      - name: Report typecheck errors
        if: steps.typecheck.outputs.status != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const log = fs.readFileSync('tsc.log', 'utf8');
            const body = '### tsc errors\n```\n' + log.slice(0, 60000) + '\n```';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      - name: Fail on type errors
        if: steps.typecheck.outputs.status != '0'
        run: exit 1

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Audit production dependencies
        # Пока не блокирует: критический advisory Next.js 14 закрывается
        # мажорным обновлением фреймворка (см. docs/security-hardening.md).
        # После обновления шаг станет обязательным (`continue-on-error` убрать).
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

      - name: Secret scan (пароли и invite-токены в исходниках)
        run: |
          if grep -rnE "Admin123!|Fullhouse123!|Anna123!|admin-(sinlycem|fulhouse|annat)-20" \
             --include="*.ts" --include="*.tsx" --include="*.md" --include="*.json" \
             --exclude-dir=node_modules --exclude-dir=.git .; then
            echo "::error::В репозитории найдены секреты администратора"
            exit 1
          fi
          echo "Секретов не найдено"
