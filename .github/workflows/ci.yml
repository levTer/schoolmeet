# CI веб-приложения: типы, тесты, сборка и аудит зависимостей.
#
# Зачем: до этого в репозитории были только сборки desktop/Android, а 400+
# тестов не запускались ни в одном PR — регресс проходил молча.
#
# Prisma-клиент генерируется до проверки типов: без него `tsc` не видит типы
# моделей и проверка теряет смысл.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Types, tests & build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      # Нужен только для проверки миграций: `prisma migrate deploy` применяет их
      # к пустой базе, а `migrate diff` подтверждает, что схема не разошлась с
      # историей миграций.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: schoolmeet
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # Postgres поднят сервисом ниже: миграции применяются по-настоящему,
      # а сборка по-прежнему не требует внешней БД.
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/schoolmeet?schema=public"
      NEXTAUTH_SECRET: "ci-only-secret-not-used-in-production"
      NEXTAUTH_URL: "http://localhost:3000"
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 22, а не 20: тесты используют `mock.module("@/lib/prisma")`,
          # а загрузчик моков в Node 20 не резолвит alias из tsconfig
          # (`ERR_MODULE_NOT_FOUND: scripts/@/lib/prisma`).
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Prisma client
        run: npx prisma generate

      - name: Migrations apply cleanly
        run: npx prisma migrate deploy

      - name: Schema matches migrations
        # Любое изменение `schema.prisma` без миграции валит CI: иначе прод
        # и репозиторий незаметно расходятся.
        run: |
          npx prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url "postgresql://postgres:postgres@localhost:5432/postgres" \
            --exit-code

      - name: Lint
        # `next build` больше не запускает ESLint (в Next.js 16 `next lint`
        # удалён), поэтому ошибки линта проверяются отдельным шагом.
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Runtime smoke (сервер поднимается и отвечает)
        # Сборка может пройти, а рантайм — упасть (например, Next 16 без
        # globalThis.AsyncLocalStorage в кастомном сервере). Проверяем реальный
        # запуск: страница входа и лендинг отвечают 200, БД для этого не нужна.
        run: |
          set -euo pipefail
          npm run start > /tmp/server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill ${SERVER_PID} 2>/dev/null || true' EXIT

          ready=0
          for _ in $(seq 1 40); do
            if curl -fsS -o /dev/null http://localhost:3000/login; then ready=1; break; fi
            if ! kill -0 ${SERVER_PID} 2>/dev/null; then
              echo "::error::Сервер завершился при старте"; cat /tmp/server.log; exit 1
            fi
            sleep 1
          done

          if [ "$ready" -ne 1 ]; then
            echo "::error::Сервер не ответил за 40 секунд"; cat /tmp/server.log; exit 1
          fi

          curl -fsS -o /dev/null http://localhost:3000/
          # Заголовки безопасности и отсутствие утечки версии фреймворка.
          headers=$(curl -sS -D - -o /dev/null http://localhost:3000/login)
          grep -qi "content-security-policy" <<<"$headers"
          grep -qi "x-frame-options: DENY" <<<"$headers"
          if grep -qi "x-powered-by" <<<"$headers"; then
            echo "::error::Утечка X-Powered-By"; exit 1
          fi

      - name: Audit dependencies
        # Блокирующий шаг: проверяются и prod-, и dev-дерево. Desktop-сборка
        # упаковывает Electron, поэтому dev-зависимости здесь не менее важны.
        # Исключений нет — на момент обновления аудит чистый.
        run: npm audit --audit-level=high

      - name: Secret scan (пароли и invite-токены в исходниках)
        # Сканируем приложение и публичные документы. Тесты используют эти
        # строки как негативные фикстуры, а AUDIT.md — исторический отчёт,
        # поэтому они исключены: важно, чтобы секрета не было в боевом коде
        # и в документации для пользователей.
        run: |
          if grep -rnE "Admin123!|Fullhouse123!|Anna123!|admin-(sinlycem|fulhouse|annat)-20" \
             src prisma public server.ts next.config.mjs \
             README.md DEPLOYMENT.md .env.example; then
            echo "::error::В боевом коде или документации найдены секреты администратора"
            exit 1
          fi
          echo "Секретов не найдено"
