# Держим веб-сервис проснувшимся.
#
# Зачем: бесплатный тариф Render усыпляет инстанс после ~15 минут без запросов.
# Первый посетитель после сна ждёт 30–60+ секунд (а иногда браузер успевает
# показать «сайт недоступен»), и это выглядит как «сайт не работает». Пинг
# `/api/health` каждые 10 минут не даёт инстансу заснуть.
#
# Бесплатные 750 инстанс-часов Render покрывают один всегда включённый сервис
# (в месяце максимум 744 часа), поэтому пинг не выводит за пределы лимита.
#
# Важно:
#   • расписания работают только из ветки по умолчанию (main) — до мержа пинг
#     можно запустить вручную: Actions → Keep web service awake → Run workflow;
#   • GitHub запускает cron с задержкой до нескольких минут — для 15-минутного
#     сна это не критично, но полагаться на точность не стоит;
#   • GitHub отключает расписания после 60 дней без активности в репозитории:
#     любой коммит/PR включает их снова;
#   • адрес можно переопределить переменной репозитория SCHOOLMEET_URL
#     (Settings → Secrets and variables → Actions → Variables).
name: Keep web service awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Пинговать /api/health
        env:
          SITE_URL: ${{ vars.SCHOOLMEET_URL || 'https://schoolmeet-vb96.onrender.com' }}
        run: |
          set -uo pipefail
          url="${SITE_URL%/}/api/health"
          # Холодный старт Render укладывается в 60–90 секунд, поэтому ждём
          # дольше обычного таймаута и повторяем попытку.
          for attempt in 1 2 3; do
            response=$(curl -sS --max-time 90 -w '\n%{http_code}' "$url" 2>&1 || true)
            code=$(printf '%s' "$response" | tail -n1)
            body=$(printf '%s' "$response" | sed '$d')
            echo "попытка ${attempt}: HTTP ${code}"
            echo "$body" | head -c 400; echo
            if [ "$code" = "200" ] && printf '%s' "$body" | grep -q '"ok":true'; then
              echo "::notice::Сервис отвечает 200 — инстанс проснулся и не заснёт."
              exit 0
            fi
            sleep 20
          done
          echo "::error::Сервис не ответил 200 за три попытки — проверьте Render (деплой, переменные окружения, логи)."
          exit 1
