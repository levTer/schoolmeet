<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'"
    />
    <title>EduFlow</title>
    <style>
      /* Дизайн №9 лендинга: тёмный сланец, золотой акцент. */
      :root {
        color-scheme: dark;
      }
      * {
        margin: 0;
        box-sizing: border-box;
      }
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0b0f17;
        color: #e2e8f0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        -webkit-user-select: none;
        user-select: none;
        cursor: default;
      }
      .card {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        padding: 32px;
        text-align: center;
      }
      .icon {
        width: 88px;
        height: 88px;
        border-radius: 22px;
        box-shadow: 0 18px 44px -14px rgba(0, 0, 0, 0.8), 0 0 34px -8px rgba(245, 158, 11, 0.35);
      }
      h1 {
        font-size: 24px;
        font-weight: 700;
        letter-spacing: 0.01em;
      }
      .status {
        font-size: 14px;
        color: #94a3b8;
        line-height: 1.55;
        max-width: 340px;
      }
      .spinner {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        border: 3px solid rgba(245, 158, 11, 0.22);
        border-top-color: #f59e0b;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .error {
        display: none;
        flex-direction: column;
        align-items: center;
        gap: 12px;
      }
      body.is-error .spinner {
        display: none;
      }
      body.is-error .error {
        display: flex;
      }
      button {
        border: 0;
        border-radius: 12px;
        background: #f59e0b;
        color: #020617;
        font-size: 14px;
        font-weight: 700;
        padding: 11px 26px;
        cursor: pointer;
      }
      button:hover {
        background: #fbbf24;
      }
      button:focus-visible {
        outline: 2px solid #fde68a;
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <img class="icon" src="assets/icon.png" alt="" width="88" height="88" />
      <h1>EduFlow</h1>
      <div class="spinner" aria-hidden="true"></div>
      <p class="status" id="status">Подключаемся к серверу…</p>
      <div class="error" id="error">
        <p class="status">
          Не удалось подключиться. Проверьте интернет — если сервер «спал», его пробуждение
          занимает до минуты.
        </p>
        <button type="button" id="retry">Повторить</button>
      </div>
    </main>
    <script>
      // Повтор = перезагрузка этого экрана: main-процесс увидит did-finish-load
      // и запустит подключение заново.
      document.getElementById("retry").addEventListener("click", () => location.reload());

      // main-процесс вызывает это, когда сервер не ответил за отведённое время.
      window.__eduflowShowError = function () {
        document.body.classList.add("is-error");
        document.getElementById("status").textContent = "Сервер пока молчит";
      };
    </script>
  </body>
</html>
