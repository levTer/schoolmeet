<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EduFlow — нет подключения</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b0f17;
        --card: #111827;
        --accent: #10b981;
        --text: #f9fafb;
        --muted: #9ca3af;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px;
        font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
        color: var(--text);
        background: var(--bg);
      }
      .card {
        width: 100%;
        max-width: 460px;
        text-align: center;
        padding: 36px 32px 30px;
        border-radius: 16px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: var(--card);
        box-shadow: 0 8px 24px -16px rgba(0, 0, 0, 0.9);
        backdrop-filter: blur(12px);
      }
      .logo {
        width: 72px;
        height: 72px;
        margin: 0 auto 18px;
        border-radius: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 34px;
        background: rgba(16, 185, 129, 0.12);
        border: 1px solid rgba(16, 185, 129, 0.3);
      }
      h1 {
        margin: 0 0 10px;
        font-size: 22px;
        font-weight: 650;
        letter-spacing: -0.01em;
      }
      p {
        margin: 0 0 8px;
        font-size: 14px;
        line-height: 1.6;
        color: var(--muted);
      }
      .reason {
        display: inline-block;
        margin-top: 6px;
        padding: 6px 12px;
        border-radius: 999px;
        border: 1px solid rgba(16, 185, 129, 0.25);
        background: rgba(16, 185, 129, 0.08);
        color: #6ee7b7;
        font-size: 12px;
      }
      .actions {
        margin-top: 24px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      button {
        width: 100%;
        padding: 12px 18px;
        border-radius: 14px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        background: rgba(255, 255, 255, 0.04);
        color: #fff;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: transform 0.15s ease, border-color 0.15s ease, background 0.15s ease;
      }
      button:hover {
        transform: translateY(-1px);
        border-color: rgba(255, 255, 255, 0.45);
        background: rgba(255, 255, 255, 0.08);
      }
      button.primary {
        border-color: transparent;
        background: var(--accent);
        color: #0b0f17;
      }
      button.primary:hover {
        background: #34d399;
      }
      .hint {
        margin-top: 18px;
        font-size: 12px;
        color: #6b7280;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="logo" aria-hidden="true">⚡</div>
      <h1>Нет подключения к EduFlow</h1>
      <p>Проверьте интернет — и попробуйте ещё раз. Приложение откроет уроки, доску и ИИ-помощника, как только сеть вернётся.</p>
      <span class="reason" id="reason">Сайт недоступен</span>
      <div class="actions">
        <button type="button" class="primary" id="retry">Повторить</button>
        <button type="button" id="browser">Открыть в браузере</button>
      </div>
      <p class="hint">EduFlow Desktop · приложение работает на движке Chromium</p>
    </main>
    <script>
      const APP_URL = (window.eduflowDesktop && window.eduflowDesktop.appUrl) || "https://schoolmeet-vb96.onrender.com";
      const reason = new URLSearchParams(location.search).get("reason");
      if (reason) document.getElementById("reason").textContent = reason;

      document.getElementById("retry").addEventListener("click", () => {
        if (window.eduflowDesktop) window.eduflowDesktop.reload();
        else location.href = APP_URL;
      });
      document.getElementById("browser").addEventListener("click", () => {
        if (window.eduflowDesktop) window.eduflowDesktop.openExternal(APP_URL);
        else location.href = APP_URL;
      });
    </script>
  </body>
</html>
