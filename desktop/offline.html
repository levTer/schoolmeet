<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EduFlow — нет подключения</title>
    <style>
      :root {
        color-scheme: dark;
        --slate: #0f172a;
        --gold: #f59e0b;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px;
        font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
        color: #e2e8f0;
        background:
          radial-gradient(120% 90% at 50% 0%, rgba(245, 158, 11, 0.16), transparent 60%),
          linear-gradient(180deg, #0a1b3d 0%, #0f172a 45%, #000000 100%);
        /* Системный заголовок окна скрыт (titleBarStyle: hidden) — страницу
           можно перетаскивать за любое свободное место, как за шапку окна. */
        -webkit-app-region: drag;
      }
      .card {
        width: 100%;
        max-width: 460px;
        text-align: center;
        padding: 36px 32px 30px;
        border-radius: 26px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: rgba(15, 23, 42, 0.86);
        box-shadow:
          0 30px 80px -40px rgba(0, 0, 0, 0.95),
          0 0 60px -28px rgba(245, 158, 11, 0.5);
        backdrop-filter: blur(12px);
      }
      .logo {
        width: 72px;
        height: 72px;
        margin: 0 auto 18px;
        border-radius: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 34px;
        background: rgba(245, 158, 11, 0.12);
        border: 1px solid rgba(245, 158, 11, 0.35);
        box-shadow: 0 0 34px -12px rgba(245, 158, 11, 0.9);
      }
      h1 {
        margin: 0 0 10px;
        font-size: 22px;
        font-weight: 650;
        letter-spacing: -0.01em;
      }
      p {
        margin: 0 0 8px;
        font-size: 14px;
        line-height: 1.6;
        color: #94a3b8;
      }
      .reason {
        display: inline-block;
        margin-top: 6px;
        padding: 6px 12px;
        border-radius: 999px;
        border: 1px solid rgba(245, 158, 11, 0.25);
        background: rgba(245, 158, 11, 0.1);
        color: #fcd34d;
        font-size: 12px;
      }
      .actions {
        margin-top: 24px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      button {
        /* Кнопки остаются кликабельными внутри drag-области заголовка. */
        -webkit-app-region: no-drag;
        width: 100%;
        padding: 12px 18px;
        border-radius: 14px;
        border: 1px solid rgba(255, 255, 255, 0.25);
        background: var(--slate);
        color: #fff;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: transform 0.15s ease, border-color 0.15s ease, background 0.15s ease;
      }
      button:hover {
        transform: translateY(-1px);
        border-color: rgba(255, 255, 255, 0.45);
        background: #111a2f;
      }
      button.primary {
        border-color: transparent;
        background: linear-gradient(180deg, #fbbf24, var(--gold));
        color: #0f172a;
        box-shadow: 0 12px 30px -14px rgba(245, 158, 11, 0.9);
      }
      button.primary:hover {
        background: linear-gradient(180deg, #fcd34d, #f59e0b);
      }
      .hint {
        margin-top: 18px;
        font-size: 12px;
        color: #64748b;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="logo" aria-hidden="true">⚡</div>
      <h1>Нет подключения к EduFlow</h1>
      <p>Проверьте интернет — и попробуйте ещё раз. Приложение откроет уроки, доску и ИИ-помощника, как только сеть вернётся.</p>
      <span class="reason" id="reason">Сайт недоступен</span>
      <div class="actions">
        <button type="button" class="primary" id="retry">Повторить</button>
        <button type="button" id="browser">Открыть в браузере</button>
      </div>
      <p class="hint">EduFlow Desktop · приложение работает на движке Chromium</p>
    </main>
    <script>
      const APP_URL = (window.eduflowDesktop && window.eduflowDesktop.appUrl) || "https://schoolmeet-vb96.onrender.com";
      const reason = new URLSearchParams(location.search).get("reason");
      if (reason) document.getElementById("reason").textContent = reason;

      document.getElementById("retry").addEventListener("click", () => {
        if (window.eduflowDesktop) window.eduflowDesktop.reload();
        else location.href = APP_URL;
      });
      document.getElementById("browser").addEventListener("click", () => {
        if (window.eduflowDesktop) window.eduflowDesktop.openExternal(APP_URL);
        else location.href = APP_URL;
      });
    </script>
  </body>
</html>
