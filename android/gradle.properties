# Настройки Gradle для Android-контейнера (android/).
# CI собирает здесь только Unsigned Debug APK как проверку компиляции;
# релизный подписанный APK собирает scripts/build-android.sh.
#
# Дефолтных 512 МиБ демона Gradle не хватает Android Gradle Plugin 8.
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
# В CI нужен одноразовый билд без фонового демона.
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.caching=true
